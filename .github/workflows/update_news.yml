name: Update India VCM news feed

on:
  workflow_dispatch:
  schedule:
    - cron: '17 0,6,12,18 * * *'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: indiavcm-news-update
  cancel-in-progress: false

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build feed
        env:
          PYTHONPATH: ${{ github.workspace }}
          VCM_REFERENCE_BASES: https://indiavcm.com/data/reference/;https://probablyshubham.github.io/indiavcm_test/data/reference/
        run: python -m src.build_feed

      - name: Validate feed
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python -m src.validate_feed

      - name: Commit changed feed
        run: |
          git config user.name "indiavcm-news-bot"
          git config user.email "actions@users.noreply.github.com"
          git add news.json news_meta.json state/ archive/
          git add reference/live_*.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No feed changes"
          else
            git commit -m "Update news feed $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: '.'

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
